<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0f0c1b">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🚚</text></svg>">
  <title>Подвоз — Wildberries</title>
  <style>
    :root {
      color-scheme: dark;
      --bg-main: #0f0c1b;
      --bg-card: #18142c;
      --primary: #8a2be2;
      --accent-green: #00f5d4;
      --text-main: #f3f0ff;
      --text-muted: #a39fbc;
      --border-soft: rgba(255,255,255,.07);
    }
    body {
      font-family: 'Segoe UI', Roboto, -apple-system, BlinkMacSystemFont, sans-serif;
      margin: 0;
      padding: max(15px, env(safe-area-inset-top)) 15px max(15px, env(safe-area-inset-bottom));
      background-color: var(--bg-main); color: var(--text-main);
      background-image: radial-gradient(ellipse 80% 50% at 50% -10%, rgba(138,43,226,.18), transparent);
      display: flex; justify-content: center; align-items: center; min-height: 95vh;
      -webkit-user-select: none; user-select: none;
    }
    .container {
      width: 100%; max-width: 460px;
      background: linear-gradient(160deg, #1b1633 0%, #151126 55%, #120e22 100%);
      padding: 34px 30px; border-radius: 20px; box-sizing: border-box;
      border: 1px solid var(--border-soft);
      box-shadow: 0 20px 60px rgba(0,0,0,.55), inset 0 1px 0 rgba(255,255,255,.05);
    }
    .logo {
      width: 74px; height: 74px; margin: 0 auto 18px; border-radius: 22px;
      background: linear-gradient(135deg, #9d4edd, #7c3aed);
      display: flex; align-items: center; justify-content: center; font-size: 34px;
      box-shadow: 0 10px 30px rgba(138,43,226,.4);
    }
    h1 { margin: 0 0 6px; text-align: center; font-size: 26px; font-weight: 800; letter-spacing: .3px; }
    .sub { margin: 0 0 28px; text-align: center; color: var(--text-muted); font-size: 14px; }
    .cards { display: flex; flex-direction: column; gap: 14px; }
    .card {
      display: flex; align-items: center; gap: 16px;
      background: rgba(255,255,255,.04); border: 1px solid var(--border-soft);
      border-radius: 16px; padding: 18px; text-decoration: none; color: var(--text-main);
      transition: transform .15s ease, border-color .2s ease, background .2s ease;
      box-shadow: 0 6px 20px rgba(0,0,0,.25);
    }
    .card:hover { transform: translateY(-2px); background: rgba(255,255,255,.06); }
    .card:active { transform: scale(.98); }
    .card-purple:hover { border-color: rgba(138,43,226,.5); }
    .card-green:hover { border-color: rgba(0,245,212,.4); }
    .card-icon {
      flex: 0 0 56px; height: 56px; border-radius: 16px;
      display: flex; align-items: center; justify-content: center; font-size: 26px;
    }
    .card-purple .card-icon { background: linear-gradient(135deg, #9d4edd, #7c3aed); box-shadow: 0 6px 18px rgba(138,43,226,.35); }
    .card-green .card-icon { background: linear-gradient(135deg, #00f5d4, #01bfa8); box-shadow: 0 6px 18px rgba(0,245,212,.25); }
    .card-text { flex: 1; display: flex; flex-direction: column; gap: 4px; }
    .card-text b { font-size: 17px; font-weight: 700; }
    .card-text span { font-size: 13px; color: var(--text-muted); line-height: 1.45; }
    .card-arrow { color: var(--text-muted); font-size: 20px; font-weight: 700; }
    .footer { margin: 26px 0 0; text-align: center; color: var(--text-muted); font-size: 12px; }
  </style>
</head>
<body>

<div class="container">
  <div class="logo">🚚</div>
  <h1>Подвоз</h1>
  <p class="sub">Wildberries · Выберите задачу</p>

  <div class="cards">
    <a class="card card-purple" href="execute.html">
      <div class="card-icon">✅</div>
      <div class="card-text">
        <b>Управление подвозом</b>
        <span>Вход для сотрудников: принять заказ и отметить «Готово»</span>
      </div>
      <div class="card-arrow">→</div>
    </a>

    <a class="card card-green" href="zayavka.html">
      <div class="card-icon">📋</div>
      <div class="card-text">
        <b>Заказать подвоз</b>
        <span>Оставить заявку на подвоз в квадрат</span>
      </div>
      <div class="card-arrow">→</div>
    </a>
  </div>

  <p class="footer">СЦ Подольск 3</p>
</div>

</body>
</html>
